<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#5d6773"/></marker>
  <style>
    .title{font-family:Arial,sans-serif;font-size:34px;font-weight:700;fill:#1b2430}
    .subtitle{font-family:Arial,sans-serif;font-size:18px;fill:#566273}
    .layer{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#314155}
    .compTitle{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#17212e}
    .compText{font-family:Arial,sans-serif;font-size:15px;fill:#445160}
    .iface{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#2d3745}
    .small{font-family:Arial,sans-serif;font-size:14px;fill:#5c6877}
    .legend{font-family:Arial,sans-serif;font-size:14px;fill:#465263}
  </style>
</defs>

<!-- Background -->
<rect width="1800" height="1100" fill="#f7f9fc"/>
<text x="70" y="65" class="title">Lab 3 - Smart Lab Equipment &amp; Slot Reservation Portal</text>
<text x="70" y="98" class="subtitle">Selected architecture: Layered Architecture | Components, provided/required interfaces and dependencies</text>

<!-- Layer containers -->
<rect x="55" y="145" width="355" height="735" rx="18" fill="#edf4ff" stroke="#9db8df" stroke-width="2"/>
<rect x="445" y="145" width="930" height="735" rx="18" fill="#f1f8f2" stroke="#a6c9ad" stroke-width="2"/>
<rect x="1410" y="145" width="335" height="735" rx="18" fill="#fff6e8" stroke="#dfbf89" stroke-width="2"/>
<text x="85" y="188" class="layer">PRESENTATION LAYER</text>
<text x="475" y="188" class="layer">BUSINESS LAYER</text>
<text x="1440" y="188" class="layer">DATA LAYER</text>

<!-- Components -->
<!-- UI -->
<g filter="url(#shadow)">
 <rect x="105" y="430" width="255" height="175" rx="10" fill="#ffffff" stroke="#3f74b5" stroke-width="3"/>
</g>
<rect x="105" y="430" width="255" height="43" rx="10" fill="#dceaff"/>
<text x="122" y="457" class="compTitle">&lt;&lt;component&gt;&gt;</text>
<text x="122" y="496" class="compTitle">Student / Technician UI</text>
<text x="122" y="526" class="compText">View availability</text>
<text x="122" y="549" class="compText">Reserve / cancel slot</text>
<text x="122" y="572" class="compText">Manage calibration / returns</text>

<!-- Auth -->
<g filter="url(#shadow)"><rect x="505" y="250" width="310" height="165" rx="10" fill="#fff" stroke="#4d8d5a" stroke-width="3"/></g>
<rect x="505" y="250" width="310" height="43" rx="10" fill="#dff1e2"/>
<text x="522" y="277" class="compTitle">&lt;&lt;component&gt;&gt;</text>
<text x="522" y="318" class="compTitle">Authentication &amp; Authorization</text>
<text x="522" y="347" class="compText">Student / technician login</text>
<text x="522" y="370" class="compText">Role checks before restricted actions</text>

<!-- Reservation -->
<g filter="url(#shadow)"><rect x="875" y="250" width="360" height="190" rx="10" fill="#fff" stroke="#4d8d5a" stroke-width="3"/></g>
<rect x="875" y="250" width="360" height="43" rx="10" fill="#dff1e2"/>
<text x="892" y="277" class="compTitle">&lt;&lt;component&gt;&gt;</text>
<text x="892" y="318" class="compTitle">Reservation Manager</text>
<text x="892" y="347" class="compText">Availability + 2-hour / 7-day rules</text>
<text x="892" y="370" class="compText">Double-booking prevention / slot lock</text>
<text x="892" y="393" class="compText">Create, cancel, confirm reservations</text>

<!-- Equipment -->
<g filter="url(#shadow)"><rect x="505" y="535" width="310" height="180" rx="10" fill="#fff" stroke="#4d8d5a" stroke-width="3"/></g>
<rect x="505" y="535" width="310" height="43" rx="10" fill="#dff1e2"/>
<text x="522" y="562" class="compTitle">&lt;&lt;component&gt;&gt;</text>
<text x="522" y="603" class="compTitle">Equipment &amp; Calibration Manager</text>
<text x="522" y="632" class="compText">Equipment registration / availability</text>
<text x="522" y="655" class="compText">Calibration status updates</text>
<text x="522" y="678" class="compText">Only calibrated equipment reservable</text>

<!-- Return -->
<g filter="url(#shadow)"><rect x="875" y="535" width="360" height="180" rx="10" fill="#fff" stroke="#4d8d5a" stroke-width="3"/></g>
<rect x="875" y="535" width="360" height="43" rx="10" fill="#dff1e2"/>
<text x="892" y="562" class="compTitle">&lt;&lt;component&gt;&gt;</text>
<text x="892" y="603" class="compTitle">Return &amp; Late-Return Manager</text>
<text x="892" y="632" class="compText">Record equipment returns</text>
<text x="892" y="655" class="compText">Mark overdue reservations</text>
<text x="892" y="678" class="compText">Apply late-return workflow</text>

<!-- Database -->
<g filter="url(#shadow)"><rect x="1440" y="420" width="275" height="195" rx="10" fill="#fff" stroke="#b47c27" stroke-width="3"/></g>
<rect x="1440" y="420" width="275" height="43" rx="10" fill="#ffedc9"/>
<text x="1457" y="447" class="compTitle">&lt;&lt;component&gt;&gt;</text>
<text x="1457" y="488" class="compTitle">Lab Reservation Database</text>
<text x="1457" y="518" class="compText">Students / roles</text>
<text x="1457" y="541" class="compText">Equipment + calibration</text>
<text x="1457" y="564" class="compText">Reservations / returns</text>
<text x="1457" y="587" class="compText">Transactional locking</text>

<!-- UML provided interface helper: lollipop -->
<!-- UI required sockets on right -->
<g fill="none" stroke="#556170" stroke-width="3">
  <path d="M360 470 q28 0 28 18 q0 18 -28 18"/>
  <path d="M360 520 q28 0 28 18 q0 18 -28 18"/>
  <path d="M360 570 q28 0 28 18 q0 18 -28 18"/>
</g>
<!-- Auth provided ball -->
<circle cx="505" cy="335" r="9" fill="#fff" stroke="#3f4a58" stroke-width="3"/>
<!-- Reservation provided ball -->
<circle cx="875" cy="345" r="9" fill="#fff" stroke="#3f4a58" stroke-width="3"/>
<!-- Equipment provided ball -->
<circle cx="505" cy="620" r="9" fill="#fff" stroke="#3f4a58" stroke-width="3"/>
<!-- Return provided ball -->
<circle cx="875" cy="620" r="9" fill="#fff" stroke="#3f4a58" stroke-width="3"/>
<!-- Business required sockets -->
<g fill="none" stroke="#556170" stroke-width="3">
 <path d="M815 380 q28 0 28 18 q0 18 -28 18"/>
 <path d="M1235 390 q28 0 28 18 q0 18 -28 18"/>
 <path d="M815 665 q28 0 28 18 q0 18 -28 18"/>
 <path d="M1235 665 q28 0 28 18 q0 18 -28 18"/>
</g>
<!-- DB provided ball -->
<circle cx="1440" cy="520" r="9" fill="#fff" stroke="#3f4a58" stroke-width="3"/>

<!-- Connectors: UI -> business -->
<path d="M388 488 C440 455, 458 355, 496 335" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M388 538 C550 520, 675 392, 866 345" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M388 588 C425 595, 455 620, 496 620" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M388 620 C550 705, 735 660, 866 620" fill="none" stroke="#66727f" stroke-width="2.5"/>

<!-- Business -> business/data -->
<path d="M843 398 C850 405, 855 408, 868 408" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M1263 408 C1315 430, 1365 490, 1431 520" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M843 683 C980 720, 1115 720, 1235 683" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M1263 683 C1340 675, 1385 590, 1431 520" fill="none" stroke="#66727f" stroke-width="2.5"/>
<path d="M815 665 C905 650, 1010 585, 1235 665" fill="none" stroke="#66727f" stroke-width="1.8"/>

<!-- Interface labels -->
<text x="397" y="225" class="iface">IAuthAPI</text>
<text x="397" y="243" class="small">authentication / role check</text>
<text x="520" y="470" class="iface">IReservationAPI</text>
<text x="520" y="488" class="small">availability / reserve / cancel</text>
<text x="405" y="748" class="iface">IEquipmentAPI</text>
<text x="405" y="766" class="small">availability / calibration</text>
<text x="650" y="738" class="iface">IReturnAPI</text>
<text x="650" y="756" class="small">return / overdue handling</text>
<text x="832" y="458" class="iface">IEquipmentAPI</text>
<text x="832" y="476" class="small">validate calibration + slot availability</text>
<text x="1275" y="466" class="iface">IRepository</text>
<text x="1275" y="484" class="small">transactional database access</text>
<text x="1060" y="750" class="iface">IReservationAPI</text>
<text x="1060" y="768" class="small">lookup/update reservation state</text>
<text x="1270" y="700" class="iface">IRepository</text>
<text x="1270" y="718" class="small">returns + audit data</text>

<!-- Protocol labels -->
<rect x="72" y="910" width="1655" height="130" rx="14" fill="#ffffff" stroke="#d5dce5"/>
<text x="95" y="942" class="layer" font-size="17">Interface / dependency notes</text>
<text x="95" y="974" class="legend">• Solid connectors represent service communication; open circle = provided interface; socket = required interface.</text>
<text x="95" y="998" class="legend">• Security: all restricted reservation/calibration operations pass through authentication + role authorization.</text>
<text x="95" y="1022" class="legend">• Concurrency: reservation writes use transactional database locking to prevent double-booking and support the 200 ms target.</text>
</svg>